name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/skillvault
      APP_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate a fresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from the generated lockfile
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

      - name: Commit regenerated lockfile on fix branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fix/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate npm lockfile"
          git push
