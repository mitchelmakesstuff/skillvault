name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/skillvault
      APP_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate a fresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from the generated lockfile
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: skillvault-package-lock
          path: package-lock.json
          if-no-files-found: error
